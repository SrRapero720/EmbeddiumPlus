name: Build Test (everything runs)

on:
  push:
    branches: [ "1.20.1", "1.21.1-neo", "1.21.1-fabric", "1.21.11-neo", "1.21.11-fabric", "26.1.x-neo", "26.1.x-fabric", "26.2.x-neo", "26.2.x-fabric" ]
  pull_request:
    branches: [ "1.20.1", "1.21.1-neo", "1.21.1-fabric", "1.21.11-neo", "1.21.11-fabric", "26.1.x-neo", "26.1.x-fabric", "26.2.x-neo", "26.2.x-fabric" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # FORGEGRADLE 6 REQUIRES GRADLE 8.x (NOT 9); PROVISION 8.8 EXPLICITLY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build with Gradle
        run: gradle build --console=plain

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
