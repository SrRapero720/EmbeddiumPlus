import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))

// THE ACCESS TRANSFORMER IS PICKED UP AUTOMATICALLY FROM META-INF/accesstransformer.cfg
neoForge {
    version = forgeversion

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'log4j.appender.Console', 'org.apache.log4j.ConsoleAppender'
            systemProperty 'terminal.jline', 'true'
            // COMMA-SEPARATED NAMESPACES TO LOAD GAMETESTS FROM; EMPTY = ALL NAMESPACES
            systemProperty 'forge.enabledGameTestNamespaces', modid
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        register(modid) {
            sourceSet sourceSets.main
        }
    }
}

// INCLUDE RESOURCES GENERATED BY DATA GENERATORS
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    // WATERCONFIG RESOLVED STANDALONE SO repackWaterConfig CAN REBUILD IT; COMPILE-ONLY BECAUSE
    // BOTH DEV AND PRODUCTION LOAD THE REPACKED JAR INSTEAD
    waterconfig { transitive = false }
    compileOnly.extendsFrom waterconfig
    // PRODUCTION SODIUM SHELL, RESOLVED ONLY SO stripSodiumShell CAN REPACKAGE IT
    sodiumShell { transitive = false }
}

// RE-MANIFEST WATERCONFIG AS A GAMELIBRARY SO IT JOINS THE GAME LAYER, WHERE ITS ServiceLoader
// LOOKUPS RESOLVE OUR ICodec PROVIDER. THE SAME JAR SERVES DEV (CLASSPATH; FML SKIPS PLAIN
// LIBRARY JARS THERE) AND PRODUCTION (NESTED UNDER META-INF/jarjar BY THE JAR TASK)
tasks.register('repackWaterConfig', Jar) {
    archiveBaseName = 'waterconfig-gamelib'
    archiveVersion = waterconfigversion
    destinationDirectory = layout.buildDirectory.dir('waterconfig-lib')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.waterconfig.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
                'FMLModType': 'GAMELIBRARY',
                'Automatic-Module-Name': 'me.srrapero720.waterconfig'
        )
    }
}

// JAR-IN-JAR DESCRIPTOR FOR THE NESTED WATERCONFIG (FML READS META-INF/jarjar/metadata.json).
// HAND-ROLLED BECAUSE MODDEV'S jarJar CAN ONLY NEST THE RAW ARTIFACT, WHICH LACKS FMLModType
tasks.register('waterConfigJarJarMetadata') {
    def metadataFile = layout.buildDirectory.file('waterconfig-lib/metadata.json')
    inputs.property 'waterconfigversion', waterconfigversion
    outputs.file metadataFile
    doLast {
        metadataFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                jars: [[
                        identifier  : [group: 'com.github.SrRapero720', artifact: 'waterconfig'],
                        version     : [range: "[$waterconfigversion,)".toString(), artifactVersion: waterconfigversion],
                        path        : "META-INF/jarjar/waterconfig-gamelib-${waterconfigversion}.jar".toString(),
                        isObfuscated: false
                ]]
        ]))
    }
}

// REPACK THE PRODUCTION SODIUM SHELL INTO A PLAIN LIBRARY: DROP THE MOD METADATA SO IT NO LONGER
// CLAIMS MODID "sodium" ON THE DEV CLASSPATH, WHILE KEEPING THE SUPPORT CLASSES THE MOD REFERENCES
tasks.register('stripSodiumShell', Jar) {
    archiveBaseName = 'wsodium-neoforge-shell-lib'
    archiveVersion = sodiumversion.replace('+', '-')
    destinationDirectory = layout.buildDirectory.dir('sodium-shell-lib')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.sodiumShell.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/jarjar/**'
    exclude 'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator'
    manifest {
        attributes(
                'FMLModType': 'LIBRARY',
                'Automatic-Module-Name': 'sodium_service'
        )
    }
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.caffeinemc.net/releases' } // SODIUM
    maven { url = 'https://maven.sinytra.org/' } // FORGIFIED FABRIC API (DEV RUNTIME)
    maven { url = 'https://maven.ryanhcode.dev/releases' } // SABLE + SABLE COMPANION
    maven { url = 'https://maven.blamejared.com' } // JEI
    maven { url = 'https://maven.shedaniel.me' } // REI
    maven { url = 'https://maven.architectury.dev' } // ARCHITECTURY API + CLOTH CONFIG
    maven { url = 'https://maven.terraformersmc.com/releases' } // EMI
    maven { // IRIS — MODRINTH IS A UNIVERSAL PROXY, SO FILTER IT TO ITS OWN GROUP
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://jitpack.io' } // WATERCONFIG
}

dependencies {
    // CONFIG LIBRARY (JAR-IN-JAR; WATERCONFIG REGISTERS CODECS/FORMATS VIA ServiceLoader)
    waterconfig "com.github.SrRapero720:waterconfig:$waterconfigversion"
    runtimeOnly files(tasks.named('repackWaterConfig'))

    // IRIS: RUNTIME-ONLY, NON-TRANSITIVE (KEEPS ITS BUNDLED SODIUM OUT)
    // TEMPORARILY DEV-EXCLUDED (kept on purpose for future Iris integrations; no critical ones depend on it now).
    // Iris + Sodium 0.8.13 WORK IN PRODUCTION but crash ONLY in the NeoForge dev runClient: the production Sodium
    // jar's mixin refmap + Iris trigger a strict @Overwrite conflict on BufferBuilder.putBulkData that dev enforces
    // and prod does not (confirmed not chloride, not fixed by any Iris version). This line only affects the dev
    // runClient classpath — never the shipped jar nor the user's own production Iris install. Uncomment to re-enable.
    // runtimeOnly("maven.modrinth:iris:$irisversion") { transitive = false }

    // SODIUM SHIPS 3 ARTIFACTS: -neoforge (PRODUCTION SHELL: LIBRARY THAT JARJARS THE REAL MOD),
    // -neoforge-mod (THE REAL MOD, CLAIMS MODID "sodium") AND -neoforge-api (COMPILE-ONLY API).
    // ON THE DEV CLASSPATH THE SHELL ITSELF BINDS MODID "sodium" AS A LIBRARY INSTEAD OF EXTRACTING
    // THE NESTED MOD, KILLING THE RUN WITH "sodium is not installed". FIX: LOAD -mod DIRECTLY, ADD
    // THE SHELL SUPPORT CLASSES STRIPPED OF MOD METADATA (stripSodiumShell). NO FFAPI SHIMS NEEDED:
    // SODIUM 0.8.13 IS SELF-CONTAINED (ITS OWN NEOFORGE BUILD EMBEDS NO FORGIFIED FABRIC API MODULE)
    compileOnly "net.caffeinemc:sodium-neoforge-api:$sodiumversion"
    compileOnly "net.caffeinemc:sodium-neoforge-mod:$sodiumversion"

    sodiumShell "net.caffeinemc:sodium-neoforge:$sodiumversion"
    runtimeOnly "net.caffeinemc:sodium-neoforge-mod:$sodiumversion"
    runtimeOnly files(tasks.named('stripSodiumShell'))
    // DROPPED FOR 1.21.11: the 1.21.1-era FFAPI shims crash in-world — fabric-block-view-api-v2's
    // ChunkRendererRegionBuilderMixin targets net.minecraft...RenderRegionCache$ChunkInfo, REMOVED in 1.21.11
    // (ClassNotFoundException on chunk compile). No complete 1.21.11 FFAPI set exists on the Sinytra maven, and
    // Sodium 0.8.13 no longer needs any (self-contained), so these are removed rather than bumped.
    // runtimeOnly "org.sinytra.forgified-fabric-api:fabric-api-base:$ffapibaseversion"
    // runtimeOnly "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:$ffapirendererversion"
    // runtimeOnly "org.sinytra.forgified-fabric-api:fabric-rendering-data-attachment-v1:$ffapirenderdataversion"
    // runtimeOnly "org.sinytra.forgified-fabric-api:fabric-block-view-api-v2:$ffapiblockviewversion"

    // RECIPE VIEWERS (FULL JARS — WE MIX INTO GUI INTERNALS): JEI RUNS, SWAP REI/EMI TO runtimeOnly TO TEST, ONE AT A TIME
    implementation("mezz.jei:jei-26.1.2-neoforge:$jeiversion") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:$reiversion") { transitive = false }
    // compileOnly("dev.emi:emi-neoforge:$emiversion") { transitive = false }

    // REI COMPILE DEPS: ARCHITECTURY + CLOTH CONFIG (CLOTH ALSO SUPPLIES me.shedaniel.math)
    compileOnly "dev.architectury:architectury-neoforge:$archversion"
    compileOnly("me.shedaniel.cloth:cloth-config-neoforge:$clothversion") { transitive = false }

    // SABLE: FULL MERGED JAR (JARJARS VEIL/RAPIER/COMPANION); NON-TRANSITIVE + ALONE AVOIDS UNHOSTED foundry.veil AND DUPLICATE COMMON CLASSES
    // implementation("dev.ryanhcode.sable:sable-neoforge-1.21.1:$sableversion") { transitive = false }

    // SABLE COMPANION: COMPILE-ONLY (JARJAR'D IN SABLE, SO INVISIBLE AT COMPILE)
    // compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-$mcversion:$sablecompanionversion") { transitive = false }
}

// ALWAYS RE-EXPAND: GRADLE DOES NOT TRACK EVERY PROJECT PROPERTY AS A TASK INPUT
tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['META-INF/neoforge.mods.toml', 'custom_packs/**/pack.mcmeta', 'pack.mcmeta']) {
        expand project.properties
    }
}

// THE JAR TASK PRODUCES THE DISTRIBUTABLE DIRECTLY: MOD CLASSES + WATERCONFIG NESTED VIA JAR-IN-JAR
jar {
    manifest {
        attributes([
                "Specification-Title"    : modid,
                "Specification-Vendor"   : modauthor,
                "Specification-Version"  : version,
                "Implementation-Title"   : modname,
                "Implementation-Version" : modversion,
                "Implementation-Vendor"  : modauthor,
                "MixinConfigs"           : "$modid.$mixin_file_suffix"
        ])
    }
    into('META-INF/jarjar') {
        from tasks.named('repackWaterConfig')
        from tasks.named('waterConfigJarJarMetadata')
    }
}

publishMods {
    displayName = "$modid-$modversion-${modloader.toUpperCase()}-$mcversion"
    type = ReleaseType.valueOf(versiontype.toUpperCase())
    file = tasks.jar.archiveFile
    changelog = getChangelogText()
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 10

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforgeid
        projectSlug = modid
        minecraftVersions.add(mcversion)
        javaVersions.add(JavaVersion.toVersion(javaversion))
        clientRequired = true
        serverRequired = false
        requires('sodium')
        incompatible('smooth-skies')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinthid
        minecraftVersions.add(mcversion)
        requires('sodium')
        incompatible('smooth-skies')
    }
}

// CHANGELOG = EVERY LINE OF CHANGELOG.md UP TO THE FIRST EMPTY ONE
def getChangelogText() {
    def result = ""
    for (String line : file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}
