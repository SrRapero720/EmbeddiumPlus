import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java'
    id 'idea'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))

// SODIUM SHIPS ONE ARTIFACT PER LOADER (sodium-fabric); PICK IT FROM THE modloader PROPERTY
def loader = modloader.toLowerCase()

loom {
    // ACCESS WIDENER AUTHORED IN THE MOJMAP (named) NAMESPACE; LOOM REMAPS IT TO INTERMEDIARY FOR PRODUCTION
    accessWidenerPath = file('src/main/resources/chloride.accesswidener')
}

// INCLUDE RESOURCES GENERATED BY DATA GENERATORS
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.parchmentmc.org/' } // PARCHMENT MAPPINGS
    maven { url = 'https://maven.caffeinemc.net/releases' } // SODIUM
    maven { url = 'https://maven.ryanhcode.dev/releases' } // SABLE + SABLE COMPANION
    maven { url = 'https://maven.blamejared.com' } // JEI
    maven { url = 'https://maven.shedaniel.me/' } // REI + me.shedaniel.math
    maven { url = 'https://maven.architectury.dev' } // ARCHITECTURY API + CLOTH CONFIG
    maven { url = 'https://maven.terraformersmc.com/releases' } // EMI
    maven { // IRIS — MODRINTH IS A UNIVERSAL PROXY, SO FILTER IT TO ITS OWN GROUP
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://jitpack.io' } // WATERCONFIG
}

dependencies {
    // MINECRAFT + LAYERED MAPPINGS: MOJMAPS WITH PARCHMENT, SO THE CODEBASE STAYS ON VANILLA NAMES (NO YARN REWRITE)
    minecraft "com.mojang:minecraft:$mcversion"
    mappings loom.layered {
        officialMojangMappings()
        parchment "org.parchmentmc.data:parchment-$parchmentmc:$parchmentversion@zip"
    }

    // FABRIC LOADER + API (API COVERS THE HUD/KEYBIND/BUILTIN-PACK/LIFECYCLE HOOKS NEOFORGE EXPOSED AS EVENTS)
    modImplementation "net.fabricmc:fabric-loader:$loaderversion"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$fabricapiversion"

    // CONFIG LIBRARY: PLAIN LIB FOR COMPILE + DEV RUNTIME, NESTED AS JAR-IN-JAR FOR PRODUCTION.
    // LOOM AUTO-WRAPS THE NON-MOD JAR WITH A GENERATED FABRIC DESCRIPTOR WHEN INCLUDING IT
    implementation("com.github.SrRapero720:waterconfig:$waterconfigversion") { transitive = false }
    include("com.github.SrRapero720:waterconfig:$waterconfigversion") { transitive = false }

    // SODIUM (API + IMPL LIVE IN THE SAME FABRIC JAR; THE CONFIG MIXIN COMPILES AGAINST SodiumConfigBuilder)
    modImplementation "net.caffeinemc:sodium-$loader:$sodiumversion"

    // OPTIONAL COMPAT MODS, EACH FROM ITS OWN MAVEN (MIRRORS THE NEOFORGE BUILD). NON-TRANSITIVE KEEPS THEIR
    // BUNDLED SODIUM/veil OUT OF THE DEV RUNTIME. THEIR HOOKS ARE @Pseudo MIXINS GATED BY Chloride.installed(),
    // SO PRODUCTION ONLY NEEDS THEM AT COMPILE; RUNTIME ENTRIES EXIST TO TEST BEHAVIOUR AGAINST THIS SODIUM

    // IRIS: COMPILE-ONLY — 1.8.14-beta.1 CRASHES AT RUNTIME AGAINST THIS SODIUM (MixinLevelRenderer NPE ON
    // iris$writeRainAndSnowToDepthBuffer). SWAP TO modRuntimeOnly TO RETRY WITH A SODIUM-0.8.x-COMPATIBLE IRIS
    modCompileOnly("maven.modrinth:iris:$irisversion") { transitive = false }

    // RECIPE VIEWERS (WE MIX INTO GUI INTERNALS): JEI RUNS, SWAP REI/EMI TO modRuntimeOnly TO TEST, ONE AT A TIME
    modImplementation("mezz.jei:jei-1.21.1-fabric:$jeiversion") { transitive = false }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-fabric:$reiversion") { transitive = false }
    modCompileOnly("dev.emi:emi-fabric:$emiversion") { transitive = false }
    // REI SHIPS me.shedaniel.math EXTERNALLY (THE NON-TRANSITIVE REI JAR DOES NOT PULL IT); NEEDED ONLY TO COMPILE ReiOverlayMixin
    compileOnly "me.shedaniel.cloth:basic-math:$basicmathversion"

    // REI COMPILE DEPS: ARCHITECTURY + CLOTH CONFIG
    modCompileOnly "dev.architectury:architectury-fabric:$archversion"
    modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:$clothversion") { transitive = false }

    // SABLE: COMPILE-ONLY ON FABRIC — THE MOD PULLS foundry.veil AT RUNTIME (>=4.1.4 ON 2.0.3), WHICH CLASHES
    // WITH THIS SODIUM, SO KEEP IT OUT OF THE DEFAULT DEV RUNTIME (INSTALL SABLE + veil MANUALLY TO TEST IT)
    modCompileOnly("dev.ryanhcode.sable:sable-fabric-1.21.1:$sableversion") { transitive = false }

    // SABLE COMPANION: COMPILE-ONLY (JARJAR'D IN SABLE, SO INVISIBLE AT COMPILE)
    modCompileOnly("dev.ryanhcode.sable-companion:sable-companion-common-$mcversion:$sablecompanionversion") {
        transitive = false
    }
}

// ALWAYS RE-EXPAND: GRADLE DOES NOT TRACK EVERY PROJECT PROPERTY AS A TASK INPUT
tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['fabric.mod.json', 'pack.mcmeta', 'resourcepacks/**/pack.mcmeta']) {
        expand project.properties
    }
}

publishMods {
    displayName = "$modid-$modversion-${modloader.toUpperCase()}-$mcversion"
    type = ReleaseType.valueOf(versiontype.toUpperCase())
    file = tasks.remapJar.archiveFile
    changelog = getChangelogText()
    modLoaders.add(loader)
    maxRetries = 10

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforgeid
        projectSlug = modid
        minecraftVersions.add(mcversion)
        javaVersions.add(JavaVersion.toVersion(javaversion))
        clientRequired = true
        serverRequired = false
        requires('sodium', 'fabric-api')
        incompatible('smooth-skies')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinthid
        minecraftVersions.add(mcversion)
        requires('sodium', 'fabric-api')
        incompatible('smooth-skies')
    }
}

// CHANGELOG = EVERY LINE OF CHANGELOG.md UP TO THE FIRST EMPTY ONE
def getChangelogText() {
    def result = ""
    for (String line : file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}
