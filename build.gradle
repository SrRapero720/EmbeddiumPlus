plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.+'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id "me.modmuss50.mod-publish-plugin" version '0.8.+'
}

def MT_TOKEN = System.getenv("MODRINTH_TOKEN")
def CF_TOKEN = System.getenv("CURSEFORGE_TOKEN")

java {
    withSourcesJar()
}

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))
}

minecraft {
    mappings channel: mappingschannel, version: mappingsversion
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    // generateRunFolders = true
    // folderName = "runs"

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'terminal.jline', 'true'
            arg "-mixin.config=${modid}.${mixin_file_suffix}"
            arg '--nogui'
            mods {
                "$modid" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', modid
        }

        server {
            property 'forge.enabledGameTestNamespaces', modid
        }
    }
}

mixin {
    config "${modid}.${mixin_file_suffix}"
    add sourceSets.main, "${modid}.${mixin_refmap_suffix}"
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url "https://maven.tterrag.com" } // Registrate
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url "https://repo.spongepowered.org/maven" }

    maven { url "https://maven.fabricmc.net/" }
    maven { url 'https://jitpack.io' }
}

configurations {
    shadeLibrary
    implementation.extendsFrom shadeLibrary
}

/* TELLS FORGE TO IDENTIFY LIBRARY CLASSES  */
minecraft.runs.all {
    lazyToken('minecraft_classpath') {
        configurations.shadeLibrary.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
}

jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${mcversion}-${forgeversion}"
    annotationProcessor "net.fabricmc:sponge-mixin:${mixin_fabric_version}+mixin.${mixin_version}"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))

    // DEPENDENCIES
    implementation fg.deobf("curse.maven:oculus-581495:$irisversion")
    implementation fg.deobf("curse.maven:embeddium-908741:$sodiumversion")

    // MOD COMPAT
    compileOnly fg.deobf("curse.maven:jei-238222:$jeiversion")
    implementation fg.deobf("curse.maven:roughly-enough-items-310111:$reiversion") {
        implementation fg.deobf("curse.maven:architectury-api-419699:$archversion")
        implementation fg.deobf("curse.maven:cloth-config-348521:$clothversion")
    }
    compileOnly fg.deobf("curse.maven:emi-580555:$emiversion")

    // MOD SUPPORT
    implementation fg.deobf("curse.maven:create-328085:6255513")
}

tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand project.properties
    }

}

jar {
    manifest {
        attributes([
                "Specification-Title"       : modid,
                "Specification-Vendor"      : modauthor,
                "Specification-Version"     : version,
                "Implementation-Title"      : modname,
                "Implementation-Version"    : modversion,
                "Implementation-Vendor"     : modauthor,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"              : "$modid.$mixin_file_suffix"
        ])
    }
    from {
        configurations.shadeLibrary.collect {
            it.isDirectory() ? it.matching {
                exclude '*', 'META-INF/**'
            } : zipTree(it).matching {
                exclude '*', 'META-INF/**'
            }
        }
    }
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }

    finalizedBy 'reobfJar'
}

publishMods {
    displayName = "$modname-${modloader.toUpperCase()}/mc$mcversion/v$modversion"
    type = STABLE
    file = jar.archiveFile
    changelog = getChangelogText()
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 2

    dryRun = false

    curseforge {
        accessToken = CF_TOKEN
        projectId = curseforgeid
        minecraftVersions.addAll(mcversion)
        javaVersions.addAll(JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = false
        projectSlug = modid
    }

    modrinth {
        accessToken = MT_TOKEN
        projectId = modrinthid
        minecraftVersions.addAll(mcversion)
    }
}

def getChangelogText() {
    def result = ""
    for (String line: file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}