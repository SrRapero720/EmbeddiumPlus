import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java'
    id 'idea'
    id 'net.fabricmc.fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))

def loader = modloader.toLowerCase()

loom {
    accessWidenerPath = file('src/main/resources/chloride.accesswidener')

    mods {
        register(modid) {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.caffeinemc.net/releases' } // SODIUM
    maven { url = 'https://maven.blamejared.com' } // JEI
    maven { url = 'https://maven.shedaniel.me/' } // REI + me.shedaniel.math
    maven { url = 'https://maven.architectury.dev' } // ARCHITECTURY API + CLOTH CONFIG
    maven { url = 'https://jitpack.io' } // WATERCONFIG
}

dependencies {
    minecraft "com.mojang:minecraft:$mcversion"

    implementation "net.fabricmc:fabric-loader:$loaderversion"
    implementation "net.fabricmc.fabric-api:fabric-api:$fabricapiversion"

    // CONFIG LIBRARY: PLAIN LIB FOR COMPILE + DEV RUNTIME, NESTED AS JAR-IN-JAR FOR PRODUCTION
    implementation("com.github.SrRapero720:waterconfig:$waterconfigversion") { transitive = false }
    include("com.github.SrRapero720:waterconfig:$waterconfigversion") { transitive = false }

    implementation "net.caffeinemc:sodium-$loader:$sodiumversion"

    // RECIPE VIEWERS (WE MIX INTO GUI INTERNALS): JEI RUNS, SWAP REI TO runtimeOnly TO TEST
    implementation("mezz.jei:jei-$mcversion-fabric:$jeiversion") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-fabric:$reiversion") { transitive = false }
    // REI SHIPS me.shedaniel.math EXTERNALLY; NEEDED ONLY TO COMPILE ReiOverlayMixin
    compileOnly "me.shedaniel.cloth:basic-math:$basicmathversion"

    // REI COMPILE DEPS: ARCHITECTURY + CLOTH CONFIG
    compileOnly "dev.architectury:architectury-fabric:$archversion"
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:$clothversion") { transitive = false }
}

// ALWAYS RE-EXPAND: GRADLE DOES NOT TRACK EVERY PROJECT PROPERTY AS A TASK INPUT
tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['fabric.mod.json', 'pack.mcmeta', 'resourcepacks/**/pack.mcmeta']) {
        expand project.properties
    }
}

publishMods {
    displayName = "$modid-$modversion-${modloader.toUpperCase()}-$mcversion"
    type = ReleaseType.valueOf(versiontype.toUpperCase())
    file = tasks.jar.archiveFile
    changelog = getChangelogText()
    modLoaders.add(loader)
    maxRetries = 10

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforgeid
        projectSlug = modid
        minecraftVersions.add(mcversion)
        javaVersions.add(JavaVersion.toVersion(javaversion))
        clientRequired = true
        serverRequired = false
        requires('sodium', 'fabric-api')
        incompatible('smooth-skies')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinthid
        minecraftVersions.add(mcversion)
        requires('sodium', 'fabric-api')
        incompatible('smooth-skies')
    }
}

// CHANGELOG = EVERY LINE OF CHANGELOG.md UP TO THE FIRST EMPTY ONE
def getChangelogText() {
    def result = ""
    for (String line : file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}
