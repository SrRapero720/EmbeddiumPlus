plugins {
    id 'java'
    id 'idea'
    id 'net.neoforged.gradle.userdev' version '7.+'
    id "me.modmuss50.mod-publish-plugin" version '0.8.+'
}

def MT_TOKEN = System.getenv("MODRINTH_TOKEN")
def CF_TOKEN = System.getenv("CURSEFORGE_TOKEN")

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain {
    languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))
}

minecraft {
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }
}
runs {
    configureEach {
        systemProperty  'forge.logging.console.level', 'debug'
        systemProperty  'log4j.appender.Console', "org.apache.log4j.ConsoleAppender"
        systemProperty  'terminal.jline', 'true'

        modSource sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', modid
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', modid
        programArgument '--nogui'
    }
}

// Full Sodium NeoForge version (Maven coordinate suffix), shared by the deps and the shell-strip task.
ext.sodiumNeoVersion = "0.8.12-beta.1+mc1.21.1"

configurations {
    runtimeClasspath.extendsFrom localRuntime
    // The production "sodium-neoforge" distributable, resolved only so stripSodiumShell can repackage
    // it into a plain library (see the Sodium dependency notes below). Kept off every other classpath.
    sodiumShell { transitive = false }
}

// Repackage the production Sodium jar into a plain library: drop the mod metadata so that on the
// userdev classpath it no longer claims modId "sodium" (which would shadow sodium-neoforge-mod),
// while still providing the client.compatibility / client.platform / client.console support classes
// the mod references at runtime. This mirrors what the shell contributes in production, minus the
// JarJar wrapper and the candidate-locator service (we load -mod directly instead of extracting it).
tasks.register('stripSodiumShell', Jar) {
    archiveBaseName = 'wsodium-neoforge-shell-lib'
    archiveVersion = sodiumNeoVersion.replace('+', '-')
    destinationDirectory = layout.buildDirectory.dir('sodium-shell-lib')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.sodiumShell.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/neoforge.mods.toml'
    exclude 'META-INF/jarjar/**'
    exclude 'META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator'
    manifest {
        attributes(
                'FMLModType': 'LIBRARY',
                'Automatic-Module-Name': 'sodium_service'
        )
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url "https://maven.tterrag.com" } // Registrate
    maven { url 'https://maven.minecraftforge.net/' }
    maven { url "https://repo.spongepowered.org/maven" }

    maven { url "https://maven.fabricmc.net/" }
    maven { url 'https://jitpack.io' }
    maven {url = "https://maven.ryanhcode.dev/releases"}

    maven {
        name "caffeinemcRepository"
        url "https://maven.caffeinemc.net/releases"
    }

    maven {
        name = "Sinytra"
        url = "https://maven.sinytra.org/"
    }

    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:$forgeversion"

    // DEPENDENCIES
    implementation "curse.maven:irisshaders-455508:$irisversion"

    // Sodium (NeoForge). Sodium ships THREE Maven artifacts:
    //   * sodium-neoforge      -> the production distributable: FMLModType=LIBRARY, JarJar-nests the
    //                             real mod + the Forgified Fabric API shims. 72 "support" classes
    //                             (client.compatibility / client.platform / client.console, etc.).
    //   * sodium-neoforge-mod  -> the real mod: 727 classes incl. the API, declares modId "sodium".
    //                             References the shell's support classes at runtime.
    //   * sodium-neoforge-api  -> the public API only (compile against it).
    //
    // In production you ship only the shell and FML extracts its nested mod. That does NOT work in a
    // userdev run: the shell sits on the dev classpath as a "source" jar, so FML's JarSelector binds
    // modId "sodium" to the shell itself (a LIBRARY) instead of extracting/loading the real mod, and
    // the game dies with "sodium is not installed" (the dependency is reported [MISSING]).
    //
    // Fix: reproduce the production runtime layout on the classpath WITHOUT the shell claiming the
    // mod id. Load the exploded -mod as the actual "sodium" mod, add the support classes from the
    // shell but stripped of its mod metadata (see stripSodiumShell) so it stays a plain library, and
    // re-add the Forgified Fabric API shims the shell would otherwise JarJar.
    compileOnly "net.caffeinemc:sodium-neoforge-api:$sodiumNeoVersion"
    compileOnly "net.caffeinemc:sodium-neoforge-mod:$sodiumNeoVersion"

    sodiumShell "net.caffeinemc:sodium-neoforge:$sodiumNeoVersion"
    runtimeOnly "net.caffeinemc:sodium-neoforge-mod:$sodiumNeoVersion"
    runtimeOnly files(tasks.named('stripSodiumShell'))
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308ded19"
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.1+9125b6dc19"
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-rendering-data-attachment-v1:0.3.48+73761d2e19"
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-block-view-api-v2:1.0.10+9afaaf8c19"

    // MOD COMPAT
    implementation "curse.maven:jei-238222:$jeiversion"
    compileOnly ("curse.maven:roughly-enough-items-310111:$reiversion") {
        compileOnly "curse.maven:architectury-api-419699:$archversion"
        compileOnly "curse.maven:cloth-config-348521:$clothversion"
    }
    compileOnly "curse.maven:emi-580555:$emiversion"
    implementation "curse.maven:sable-1312371:8255445" // Sable 2.0.2 — first build compatible with Sodium 0.8.x (older 8007005/1.2.2 referenced the removed SodiumGameOptions)
//    implementation "blank:betterf3:7.0.2"

    // MOD SUPPORT
    compileOnly("dev.ryanhcode.sable-companion:sable-companion-common-$mcversion:$sableversion") {
        transitive = false
    }
}

tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['META-INF/neoforge.mods.toml', 'custom_packs/**/pack.mcmeta', 'pack.mcmeta']) {
        expand project.properties
    }

}

jar {
    manifest {
        attributes([
                "Specification-Title"       : modid,
                "Specification-Vendor"      : modauthor,
                "Specification-Version"     : version,
                "Implementation-Title"      : modname,
                "Implementation-Version"    : modversion,
                "Implementation-Vendor"     : modauthor,
                "Implementation-Timestamp"  : new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"              : "$modid.$mixin_file_suffix"
        ])
    }
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}"}
    }
}

publishMods {
    displayName = "$modname-${modloader.toUpperCase()}/mc$mcversion/v$modversion"
    type = BETA
    file = jar.archiveFile
    changelog = getChangelogText()
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 2

    dryRun = false

    curseforge {
        accessToken = CF_TOKEN
        projectId = curseforgeid
        minecraftVersions.addAll(mcversion)
        javaVersions.addAll(JavaVersion.VERSION_21)
        clientRequired = true
        serverRequired = false
        projectSlug = modid
        requires("sodium")
    }

    modrinth {
        accessToken = MT_TOKEN
        projectId = modrinthid
        minecraftVersions.addAll(mcversion)
        requires("sodium")
    }
}

def getChangelogText() {
    def result = ""
    for (String line: file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}