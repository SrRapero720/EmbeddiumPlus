import me.modmuss50.mpp.ReleaseType

plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle'
    id 'net.minecraftforge.renamer'
    id 'me.modmuss50.mod-publish-plugin'
}

base {
    archivesName = modid
    version = "$modloader-mc$mcversion-v$modversion"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.valueOf(javaversion))

minecraft {
    mappings channel: mappingschannel, version: mappingsversion
    // FG7: THE AT IS A ConfigurableFileCollection ON THE MINECRAFT DEPENDENCY (APPLIED BY THE MAVENIZER)
    accessTransformer.from file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'terminal.jline', 'true'
            // FG7 DEV RUNTIME IS MOJMAP, BUT 3RD-PARTY MODS SHIP SRG MIXIN REFMAPS; LET MIXIN REMAP THEM AT
            // RUNTIME WITH THE GENERATED SRG->mojmap FILE (SAME MECHANISM FG6 USED IN DEV)
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', layout.buildDirectory.file('mixin-srg2mojmap.srg').get().asFile.absolutePath
        }
        register('client')
        register('server')
    }
}

// INCLUDE RESOURCES GENERATED BY DATA GENERATORS
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    // WATERCONFIG RESOLVED STANDALONE SO repackWaterConfig CAN REBUILD IT; COMPILE-ONLY BECAUSE
    // BOTH DEV AND PRODUCTION LOAD THE REPACKED GAMELIBRARY JAR INSTEAD
    waterconfig { transitive = false }
    compileOnly.extendsFrom waterconfig
}

// WE DELIBERATELY DROPPED CURSEMAVEN; DROP ANY MOD'S CURSE-ONLY TRANSITIVES (E.G. VS -> vanillin) GLOBALLY
configurations.all {
    exclude group: 'curse.maven'
}

// RE-MANIFEST WATERCONFIG AS A GAMELIBRARY SO IT JOINS THE GAME LAYER, WHERE ITS ServiceLoader
// LOOKUPS RESOLVE OUR ICodec PROVIDER. THE SAME JAR SERVES DEV (CLASSPATH; FML SKIPS PLAIN
// LIBRARY JARS THERE) AND PRODUCTION (NESTED UNDER META-INF/jarjar BY THE JAR TASK)
tasks.register('repackWaterConfig', Jar) {
    archiveBaseName = 'waterconfig-gamelib'
    archiveVersion = waterconfigversion
    destinationDirectory = layout.buildDirectory.dir('waterconfig-lib')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.waterconfig.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF'
    manifest {
        attributes(
                'FMLModType': 'GAMELIBRARY',
                'Automatic-Module-Name': 'me.srrapero720.waterconfig'
        )
    }
}

// JAR-IN-JAR DESCRIPTOR FOR THE NESTED WATERCONFIG (FML READS META-INF/jarjar/metadata.json).
// HAND-ROLLED BECAUSE THE TOOLCHAIN'S jarJar CAN ONLY NEST THE RAW ARTIFACT, WHICH LACKS FMLModType
tasks.register('waterConfigJarJarMetadata') {
    def metadataFile = layout.buildDirectory.file('waterconfig-lib/metadata.json')
    inputs.property 'waterconfigversion', waterconfigversion
    outputs.file metadataFile
    doLast {
        metadataFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                jars: [[
                        identifier  : [group: 'com.github.SrRapero720', artifact: 'waterconfig'],
                        version     : [range: "[$waterconfigversion,)".toString(), artifactVersion: waterconfigversion],
                        path        : "META-INF/jarjar/waterconfig-gamelib-${waterconfigversion}.jar".toString(),
                        isObfuscated: false
                ]]
        ]))
    }
}

repositories {
    // FORGEGRADLE 7 MAVENIZER: GENERATES THE MINECRAFT/FORGE ARTIFACTS ON THE FLY
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven

    maven { url = 'https://maven.blamejared.com' } // JEI
    maven { // EMBEDDIUM + OCULUS — MODRINTH IS A UNIVERSAL PROXY, SO FILTER IT TO ITS OWN GROUP
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.shedaniel.me' } // REI + CLOTH CONFIG
    maven { url = 'https://maven.architectury.dev' } // ARCHITECTURY API
    maven { url = 'https://maven.terraformersmc.com/releases' } // EMI
    maven { url = 'https://maven.createmod.net' } // CREATE + FLYWHEEL + PONDER
    maven { url = 'https://maven.tterrag.com' } // REGISTRATE
    maven { // VALKYRIEN SKIES — GREEDY PROXY MAVEN, FILTER TO ITS OWN GROUP
        url = 'https://maven.valkyrienskies.org'
        content { includeGroupByRegex 'org\\.valkyrienskies.*' }
    }
    maven { url = 'https://jitpack.io' } // WATERCONFIG
    maven { url = 'https://repo.spongepowered.org/maven' } // MIXIN AP
    maven { url = 'https://maven.fabricmc.net/' } // SPONGE-MIXIN AP
    mavenCentral()
}

dependencies {
    // VS'S POM HARD-CODES A CURSEMAVEN COORDINATE FOR vanillin; renamer's DETACHED CONFIGS IGNORE THE GLOBAL
    // curse.maven EXCLUDE, SO STRIP THE CURSE DEP FROM VS'S METADATA BEFORE THE MAVENIZER/RENAMER RESOLVES IT
    components {
        withModule('org.valkyrienskies:valkyrienskies-120-forge') {
            allVariants {
                withDependencies { removeAll { it.group == 'curse.maven' } }
            }
        }
    }

    // MINECRAFT/FORGE VIA THE FG7 MAVENIZER
    implementation minecraft.dependency("net.minecraftforge:forge:$mcversion-$forgeversion")

    // MIXIN ANNOTATION PROCESSOR (GENERATES THE REFMAP). NO MIXINGRADLE ON FG7, SO THE SRG REMAP OF THE
    // REFMAP IS WIRED BY HAND FURTHER DOWN
    annotationProcessor "net.fabricmc:sponge-mixin:$mixin_fabric_version+mixin.$mixin_version"
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:$mixinextra_version"))

    // CONFIG LIBRARY (JAR-IN-JAR; WATERCONFIG REGISTERS CODECS/FORMATS VIA ServiceLoader)
    waterconfig "com.github.SrRapero720:waterconfig:$waterconfigversion"
    runtimeOnly files(tasks.named('repackWaterConfig'))

    // RENDERING — renamer.dependency DEOBFUSCATES 3RD-PARTY MODS FROM SRG TO OUR MAPPINGS (fg.deobf REPLACEMENT)
    implementation renamer.dependency("maven.modrinth:embeddium:$sodiumversion")
    implementation renamer.dependency("maven.modrinth:oculus:$irisversion")

    // RECIPE VIEWERS (FULL JARS — WE MIX INTO GUI INTERNALS): JEI RUNS, SWAP REI/EMI TO runtimeOnly TO TEST, ONE AT A TIME
    implementation renamer.dependency("mezz.jei:jei-1.20.1-forge:$jeiversion")
    compileOnly renamer.dependency("me.shedaniel:RoughlyEnoughItems-forge:$reiversion")
    compileOnly renamer.dependency("dev.emi:emi-forge:$emiversion")

    // REI COMPILE DEPS: ARCHITECTURY + CLOTH CONFIG (CLOTH ALSO SUPPLIES me.shedaniel.math)
    compileOnly renamer.dependency("dev.architectury:architectury-forge:$archversion")
    compileOnly renamer.dependency("me.shedaniel.cloth:cloth-config-forge:$clothversion")

    // MOD SUPPORT: CREATE + ITS MANDATORY DEV MODS (flywheel/ponder MODS, registrate LIBRARY)
    implementation renamer.dependency("com.simibubi.create:create-1.20.1:$createversion:slim")
    implementation renamer.dependency("dev.engine-room.flywheel:flywheel-forge-1.20.1:$flywheelversion")
    implementation renamer.dependency("net.createmod.ponder:Ponder-Forge-1.20.1:$ponderversion")
    implementation renamer.dependency("com.tterrag.registrate:Registrate:$registrateversion")

    // MOD SUPPORT: VALKYRIEN SKIES (COMPILE-ONLY, NON-TRANSITIVE)
    compileOnly renamer.dependency("org.valkyrienskies:valkyrienskies-120-forge:$valkyrienskiesversion")
}

// DEFAULT MAPPINGS FOR RENAMER TASKS (INCLUDING THE DEPENDENCY DEOBFUSCATION ABOVE): NAMED -> SRG
renamer.mappings.from minecraft.dependency.toSrgFile

// SRG->mojmap MAPPING CONSUMED BY MIXIN'S REFMAP REMAPPER IN THE DEV RUNS (SEE THE runs BLOCK). THE
// MAVENIZER'S toSrgFile IS mojmap->SRG SO IT IS REVERSED; MIXIN ONLY REMAPS METHODS FROM THE CLASSIC SRG FORMAT
renamer.convert('mixinRemapFile') {
    map minecraft.dependency.toSrgFile
    reverse = true
    format = 'SRG'
    output = layout.buildDirectory.file('mixin-srg2mojmap.srg')
}
tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach { dependsOn 'mixinRemapFile' }

// FG7 NATIVE MIXIN REFMAP SUPPORT (REPLACES MIXINGRADLE): CONFIGURES THE SPONGE-MIXIN AP AND REMAPS THE
// GENERATED REFMAP TO SRG SO THE MIXINS APPLY IN PRODUCTION
renamer.enableMixinRefmaps {
    source(sourceSets.main) {
        refMap = "$modid.$mixin_refmap_suffix"
    }
}

// ALWAYS RE-EXPAND: GRADLE DOES NOT TRACK EVERY PROJECT PROPERTY AS A TASK INPUT
tasks.processResources.outputs.upToDateWhen { false }
processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'custom_packs/**/pack.mcmeta']) {
        expand project.properties
    }
}

// THE DISTRIBUTABLE MOD JAR MUST BE SRG-NAMED FOR PRODUCTION. THE dev `jar` IS BUILT NAMED, THEN renamer.classes
// PRODUCES THE SRG JAR AS THE MAIN ARTIFACT (NO CLASSIFIER); NESTS WATERCONFIG + SETS THE MOD MANIFEST
jar {
    archiveClassifier = 'dev'
    manifest {
        attributes([
                "Specification-Title"    : modid,
                "Specification-Vendor"   : modauthor,
                "Specification-Version"  : version,
                "Implementation-Title"   : modname,
                "Implementation-Version" : modversion,
                "Implementation-Vendor"  : modauthor,
                "MixinConfigs"           : "$modid.$mixin_file_suffix"
        ])
    }
    into('META-INF/jarjar') {
        from tasks.named('repackWaterConfig')
        from tasks.named('waterConfigJarJarMetadata')
    }
}

renamer.classes('reobfJar', tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    archiveClassifier = ''
    // REOBFUSCATE THE SHIPPED META-INF/accesstransformer.cfg FROM MOJMAP TO SRG FOR THE FORGE 1.20.1 RUNTIME
    accessTransformers = true
}

publishMods {
    displayName = "$modid-$modversion-${modloader.toUpperCase()}-$mcversion"
    type = ReleaseType.valueOf(versiontype.toUpperCase())
    file = tasks.named('reobfJar').flatMap { it.archiveFile }
    changelog = getChangelogText()
    modLoaders.add(modloader.toLowerCase())
    maxRetries = 10

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = curseforgeid
        projectSlug = modid
        minecraftVersions.add(mcversion)
        javaVersions.add(JavaVersion.toVersion(javaversion))
        clientRequired = true
        serverRequired = false
        requires('embeddium')
        incompatible('magnesium-extras', 'xenon', 'distraction-free-recipes', 'smooth-skies')
    }

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = modrinthid
        minecraftVersions.add(mcversion)
        requires('embeddium')
        incompatible('smooth-skies')
    }
}

// CHANGELOG = EVERY LINE OF CHANGELOG.md UP TO THE FIRST EMPTY ONE
def getChangelogText() {
    def result = ""
    for (String line : file('CHANGELOG.md').readLines('UTF-8')) {
        if (line.isEmpty()) return result
        result += line + '\n'
    }
    return result
}
