modLoader="javafml" #mandatory
loaderVersion="$fmlrange"
license="$modlicense"
issueTrackerURL="https://github.com/$github/issues"

[[mods]]
    modId="$modid"
    version="$modversion"
    displayName="$modname"
    displayTest="IGNORE_SERVER_VERSION"
    logoFile="pack.png" #optional
    authors="$modauthor" #optional
    credits="$modcredits"
    displayURL="https://www.curseforge.com/minecraft/mc-mods/$modid"
    description='''$moddesc'''

[[dependencies.$modid]]
    modId="forge"
    mandatory=true
    versionRange="$forgerange"
    ordering="NONE"
    side="CLIENT"

[[dependencies.$modid]]
    modId="minecraft"
    mandatory=true
    versionRange="$minecraftrange"
    ordering="NONE"
    side="CLIENT"

[[dependencies.$modid]]
    modId="embeddium"
    mandatory=true
    versionRange="$sodiumrange"
    ordering="AFTER"
    side="CLIENT"
